name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Em PRs, um push novo cancela a execução antiga; em main, cada commit é validado até o fim.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # O navegador do Playwright fica em cache (a chave segue o lockfile, que fixa a versão).
      - name: Cache do navegador do Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Instalar Chromium (com dependências do sistema)
        run: pnpm --filter @daily/web exec playwright install --with-deps chromium
      - run: pnpm e2e

      - name: Anexar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore
