name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Em PRs, um push novo cancela a execução antiga; em main, cada commit é validado até o fim.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:tokens
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # O navegador do Playwright fica em cache (a chave segue o lockfile, que fixa a versão).
      - name: Cache do navegador do Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Instalar Chromium (com dependências do sistema)
        run: pnpm --filter @daily/web exec playwright install --with-deps chromium
      - run: pnpm e2e

      - name: Anexar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore

  # Testes de segurança do perfil social (pgTAP) num Supabase LOCAL do runner (Docker).
  # Nunca fala com o banco de produção: as migrações de supabase/migrations são aplicadas só
  # neste banco descartável, e quem aplica em produção é o dono do projeto (docs/social-setup.md).
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Supabase local (Postgres, Auth e Storage)
        run: supabase start -x realtime,studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Testes de segurança (RLS, funções, Storage)
        run: supabase test db
      - name: Reversão aplica limpo (down na ordem inversa)
        run: |
          for f in $(ls supabase/rollback/*.down.sql | sort -r); do
            echo "→ $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done
